<svg width="1400" height="920" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d63e2"/>
      <stop offset="100%" stop-color="#2495d8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#138ea0"/>
      <stop offset="100%" stop-color="#36b7b9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#95a8c4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5673a8"/>
    </marker>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>
  <text x="60" y="70" font-size="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#173055">门诊预问诊与智能分诊摘要系统总体架构</text>
  <text x="60" y="108" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#60708a">课程项目的核心思路：用轻量规则保证可演示，用外部大模型补足表达能力，用可视化界面把“对话 → 摘要 → 分诊 → 挂号”串起来。</text>

  <rect x="60" y="160" rx="28" ry="28" width="260" height="620" fill="#ffffff" stroke="#dbe4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="86" y="198" rx="18" ry="18" width="208" height="74" fill="url(#blue)"/>
  <text x="190" y="243" text-anchor="middle" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#ffffff">展示层</text>
  <rect x="86" y="302" rx="18" ry="18" width="208" height="108" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="104" y="338" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">患者对话区</text>
  <text x="104" y="372" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">文本输入</text>
  <text x="104" y="400" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">图片上传</text>
  <rect x="86" y="430" rx="18" ry="18" width="208" height="126" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="104" y="466" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">摘要展示区</text>
  <text x="104" y="500" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">主诉 / 风险 / 科室</text>
  <text x="104" y="528" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">医生端摘要</text>
  <rect x="86" y="576" rx="18" ry="18" width="208" height="172" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="104" y="612" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">辅助交互</text>
  <text x="104" y="646" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">紧急弹窗提醒</text>
  <text x="104" y="674" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">JSON / PDF 导出</text>
  <text x="104" y="702" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">模拟挂号工作台</text>

  <rect x="390" y="160" rx="28" ry="28" width="320" height="620" fill="#ffffff" stroke="#dbe4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="416" y="198" rx="18" ry="18" width="268" height="74" fill="url(#teal)"/>
  <text x="550" y="243" text-anchor="middle" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#ffffff">应用层（Flask）</text>
  <rect x="416" y="302" rx="18" ry="18" width="268" height="90" fill="#f9fbff" stroke="#d5def0"/>
  <text x="438" y="338" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">/api/chat</text>
  <text x="438" y="370" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">消息校验、通道切换、摘要返回</text>
  <rect x="416" y="412" rx="18" ry="18" width="268" height="90" fill="#f9fbff" stroke="#d5def0"/>
  <text x="438" y="448" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">/api/departments</text>
  <text x="438" y="480" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">科室目录与排班信息查询</text>
  <rect x="416" y="522" rx="18" ry="18" width="268" height="90" fill="#f9fbff" stroke="#d5def0"/>
  <text x="438" y="558" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">/api/appointments</text>
  <text x="438" y="590" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">剩余号源扣减与预约结果生成</text>
  <rect x="416" y="632" rx="18" ry="18" width="268" height="116" fill="#f9fbff" stroke="#d5def0"/>
  <text x="438" y="668" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">/api/export/pdf</text>
  <text x="438" y="700" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">结构化摘要排版为 PDF</text>
  <text x="438" y="728" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">适合展示“AI 输出转文书”</text>

  <rect x="780" y="160" rx="28" ry="28" width="320" height="620" fill="#ffffff" stroke="#dbe4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="806" y="198" rx="18" ry="18" width="268" height="74" fill="url(#blue)"/>
  <text x="940" y="243" text-anchor="middle" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#ffffff">模型与逻辑层</text>
  <rect x="806" y="302" rx="18" ry="18" width="268" height="134" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="828" y="338" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">Mock 规则引擎</text>
  <text x="828" y="372" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">症状词表匹配</text>
  <text x="828" y="400" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">年龄/体温/病史抽取</text>
  <text x="828" y="428" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">红旗征象 + 分诊优先级</text>
  <rect x="806" y="456" rx="18" ry="18" width="268" height="134" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="828" y="492" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">外部大模型通道</text>
  <text x="828" y="526" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">豆包：支持多模态图片理解</text>
  <text x="828" y="554" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">DeepSeek：文本结构化输出</text>
  <text x="828" y="582" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">统一 JSON 解析与归一化</text>
  <rect x="806" y="610" rx="18" ry="18" width="268" height="138" fill="#f6f9ff" stroke="#d5def0"/>
  <text x="828" y="646" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#20355a">摘要生成逻辑</text>
  <text x="828" y="680" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">主诉生成</text>
  <text x="828" y="708" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">下一轮追问问题</text>
  <text x="828" y="736" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">医生端摘要文本</text>

  <rect x="1170" y="160" rx="28" ry="28" width="170" height="620" fill="#ffffff" stroke="#dbe4f1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1192" y="198" rx="18" ry="18" width="126" height="74" fill="url(#teal)"/>
  <text x="1255" y="243" text-anchor="middle" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" fill="#ffffff">数据层</text>
  <text x="1196" y="330" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#20355a" font-weight="700">静态字典</text>
  <text x="1196" y="364" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">症状模式</text>
  <text x="1196" y="392" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">病史关键词</text>
  <text x="1196" y="420" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">科室说明</text>
  <text x="1196" y="448" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">医生排班</text>
  <text x="1196" y="504" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#20355a" font-weight="700">配置层</text>
  <text x="1196" y="538" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">.env 密钥</text>
  <text x="1196" y="566" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">模型地址</text>
  <text x="1196" y="594" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#5f6f89">默认模型名</text>

  <line x1="320" y1="470" x2="390" y2="470" stroke="#5673a8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="710" y1="470" x2="780" y2="470" stroke="#5673a8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1100" y1="470" x2="1170" y2="470" stroke="#5673a8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="820" rx="18" ry="18" width="1280" height="58" fill="#eaf2ff" stroke="#d3ddf0"/>
  <text x="86" y="858" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#29476d">这套架构的关键取舍：没有在本地硬训练一个医学模型，而是把“可解释的规则基础能力”和“可扩展的大模型接口”放在同一个产品原型里，既稳妥又有创新空间。</text>
</svg>
